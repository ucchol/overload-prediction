[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overload"
version = "0.1.0"
description = "Held out prediction tests of how people choose under option and information load"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.8", "nbformat>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
overload = ["stimuli/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
# the verifier code is archived as written, notebooks follow Colab conventions
extend-exclude = ["verification/independent", "verification/independent_snack", "verification/independent_process", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
ignore = ["E741", "N"]
